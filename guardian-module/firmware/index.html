<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ARES — Tactical Interface</title>
    <style>
      :root {
        --cyan: #00c8ff;
        --cyan-dim: rgba(0, 200, 255, 0.12);
        --cyan-border: rgba(0, 200, 255, 0.25);
        --cyan-bright: rgba(0, 200, 255, 0.7);
        --red: #ff3034;
        --red-dim: rgba(255, 48, 52, 0.15);
        --red-glow: rgba(255, 48, 52, 0.5);
        --green: #00ff88;
        --bg: #020a12;
        --mono: "Courier New", Courier, monospace;
        --body: Arial, Helvetica, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--body);
        background: var(--bg);
        color: var(--cyan);
        font-size: 16px;
        height: 100vh;
        overflow: hidden;
        position: relative;
      }

      /* SCANLINES — léger, pas d'animation */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 200, 255, 0.012) 2px, rgba(0, 200, 255, 0.012) 4px);
        pointer-events: none;
        z-index: 900;
      }

      /* VIGNETTE */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.75) 100%);
        pointer-events: none;
        z-index: 901;
      }

      /* STREAM */
      #content {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      figure {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      .image-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .image-container.selecting {
        cursor: crosshair;
      }

      #track-panel {
        position: fixed;
        z-index: 960;
        left: 50%;
        top: 5.5rem;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.55rem 0.75rem;
        background: rgba(2, 10, 18, 0.92);
        border: 1px solid var(--cyan-border);
        border-radius: 8px;
        font: 12px var(--mono);
      }

      #track-status {
        min-width: 135px;
        color: var(--cyan);
      }
      #track-panel button {
        color: var(--bg);
        background: var(--cyan);
        border: 0;
        border-radius: 4px;
        padding: 0.45rem 0.65rem;
        font: bold 11px var(--mono);
        cursor: pointer;
      }
      #track-stop {
        background: var(--red) !important;
      }

      #tracking-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }

      #stream {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: contrast(1.2) saturate(1.05) brightness(1.05);
        transition:
          transform 0.35s ease,
          filter 0.35s ease;
      }

      .zoom-x2 #stream {
        transform: scale(2);
        transform-origin: center center;
        filter: contrast(1.3) brightness(1.1);
      }

      /* HEADER HUD */
      .hud-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 950;
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(180deg, rgba(2, 10, 18, 0.95) 0%, transparent 100%);
        border-bottom: 1px solid var(--cyan-border);
      }

      .hud-logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .hud-hex {
        width: 28px;
        height: 28px;
        background: var(--cyan-dim);
        border: 1px solid var(--cyan-border);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }

      .hud-title {
        font-family: var(--mono);
        font-size: 1rem;
        font-weight: 900;
        color: var(--cyan);
        letter-spacing: 0.3em;
        text-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
      }

      .hud-subtitle {
        font-size: 0.55rem;
        color: rgba(0, 200, 255, 0.35);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .hud-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
      }

      .hud-mode {
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--red);
        letter-spacing: 0.3em;
        text-shadow: 0 0 10px var(--red-glow);
      }

      .hud-status-bar {
        display: flex;
        gap: 1.5rem;
        align-items: center;
      }

      .status-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
      }

      .status-label {
        font-family: var(--mono);
        font-size: 0.42rem;
        color: rgba(0, 200, 255, 0.35);
        letter-spacing: 0.15em;
      }

      .status-val {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--cyan);
      }

      .status-val.ok {
        color: var(--green);
      }
      .status-val.warn {
        color: var(--red);
      }

      .hud-clock {
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--cyan);
        letter-spacing: 0.1em;
        min-width: 90px;
        text-align: right;
      }

      /* CORNERS */
      .corner {
        position: fixed;
        width: 50px;
        height: 50px;
        z-index: 960;
        pointer-events: none;
      }
      .corner.tl {
        top: 10px;
        left: 10px;
        border-top: 1px solid var(--cyan-bright);
        border-left: 1px solid var(--cyan-bright);
      }
      .corner.tr {
        top: 10px;
        right: 10px;
        border-top: 1px solid var(--cyan-bright);
        border-right: 1px solid var(--cyan-bright);
      }
      .corner.bl {
        bottom: 10px;
        left: 10px;
        border-bottom: 1px solid var(--cyan-bright);
        border-left: 1px solid var(--cyan-bright);
      }
      .corner.br {
        bottom: 10px;
        right: 10px;
        border-bottom: 1px solid var(--cyan-bright);
        border-right: 1px solid var(--cyan-bright);
      }

      /* CROSSHAIR — statique, pas de rotation */
      .crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 160px;
        height: 160px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 920;
      }

      .crosshair-ring {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(0, 200, 255, 0.2);
        border-radius: 50%;
      }

      .crosshair-ring-inner {
        position: absolute;
        inset: 20px;
        border: 1px solid rgba(0, 200, 255, 0.12);
        border-radius: 50%;
      }

      .center-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        background: var(--red);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 8px var(--red-glow);
      }

      .line {
        position: absolute;
        background: var(--red);
      }
      .line.top {
        width: 1px;
        height: 45px;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      .line.bottom {
        width: 1px;
        height: 45px;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      .line.left {
        height: 1px;
        width: 45px;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
      }
      .line.right {
        height: 1px;
        width: 45px;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }

      .tick {
        position: absolute;
        background: rgba(0, 200, 255, 0.35);
      }
      .tick.t1 {
        top: calc(50% - 30px);
        left: 50%;
        width: 1px;
        height: 6px;
      }
      .tick.t2 {
        top: calc(50% + 24px);
        left: 50%;
        width: 1px;
        height: 6px;
      }
      .tick.t3 {
        left: calc(50% - 30px);
        top: 50%;
        height: 1px;
        width: 6px;
      }
      .tick.t4 {
        left: calc(50% + 24px);
        top: 50%;
        height: 1px;
        width: 6px;
      }

      /* SIDE PANELS */
      .side-panel {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 940;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
        background: linear-gradient(180deg, transparent, rgba(2, 10, 18, 0.65), transparent);
      }

      .side-panel.left {
        left: 0;
        align-items: flex-start;
      }

      .data-row {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
      }

      .data-key {
        font-family: var(--mono);
        font-size: 0.42rem;
        color: rgba(0, 200, 255, 0.3);
        letter-spacing: 0.15em;
      }

      .data-val {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--cyan);
      }

      /* JOYSTICK */
      .joystick {
        position: fixed;
        bottom: 40px;
        width: 160px;
        height: 160px;
        z-index: 1000;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        place-items: center;
      }

      .chassis-joystick {
        left: 40px;
      }

      .turret-joystick {
        right: 40px;
      }

      .joystick::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid var(--cyan-border);
        background: radial-gradient(circle, rgba(0, 200, 255, 0.05) 0%, rgba(2, 10, 18, 0.85) 70%);
        pointer-events: none;
      }

      .joystick::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 1px solid rgba(0, 200, 255, 0.1);
        pointer-events: none;
      }

      .joystick button,
      .strafe-cmd button {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--cyan-border);
        background: rgba(0, 200, 255, 0.08);
        color: var(--cyan);
        font-size: 16px;
        cursor: pointer;
        position: relative;
        z-index: 1;
        font-family: var(--mono);
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        transition: background 0.1s;
        touch-action: none;
      }

      .joystick button:active,
      .joystick button.gp-active,
      .strafe-cmd button:active,
      .strafe-cmd button.gp-active {
        background: rgba(0, 200, 255, 0.25);
        box-shadow: 0 0 12px rgba(0, 200, 255, 0.35);
        transform: scale(0.92);
      }

      .strafe-cmd {
        position: fixed;
        bottom: 100px;
        left: 210px;
        z-index: 1000;
        display: flex;
        flex-direction: row;
        gap: 8px;
      }

      .joystick .center {
        display: none;
      }
      .joystick .up {
        grid-column: 2;
        grid-row: 1;
      }
      .joystick .left {
        grid-column: 1;
        grid-row: 2;
      }
      .joystick .right {
        grid-column: 3;
        grid-row: 2;
      }
      .joystick .down {
        grid-column: 2;
        grid-row: 3;
      }

      /* FIRE */
      #fire {
        position: fixed;
        bottom: 230px;
        right: 40px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid var(--red);
        background: var(--red-dim);
        color: var(--red);
        font-family: var(--mono);
        font-size: 0.55rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        cursor: pointer;
        z-index: 1000;
        text-shadow: 0 0 8px var(--red-glow);
        box-shadow:
          0 0 15px var(--red-dim),
          inset 0 0 15px var(--red-dim);
        transition:
          box-shadow 0.1s,
          background 0.1s;
      }

      #fire:active,
      #fire.gp-active {
        background: rgba(255, 48, 52, 0.4);
        box-shadow:
          0 0 40px var(--red-glow),
          inset 0 0 30px rgba(255, 48, 52, 0.3);
        transform: scale(0.94);
      }

      /* ZOOM + LASER */
      #zoomBtn,
      #laserBtn {
        position: fixed;
        right: 20px;
        z-index: 1000;
        background: rgba(0, 200, 255, 0.08);
        color: var(--cyan);
        border: 1px solid var(--cyan-border);
        padding: 8px 16px;
        font-family: var(--mono);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        cursor: pointer;
        clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        transition: background 0.2s;
      }
      #zoomBtn {
        top: 80px;
      }
      #laserBtn {
        top: 115px;
      }
      #zoomBtn:hover,
      #laserBtn:hover {
        background: rgba(0, 200, 255, 0.18);
      }
      #zoomBtn:active,
      #laserBtn:active {
        transform: scale(0.95);
      }

      /* BOTTOM HUD */
      .hud-bottom {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 940;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3rem;
        background: linear-gradient(0deg, rgba(2, 10, 18, 0.9) 0%, transparent 100%);
        border-top: 1px solid var(--cyan-border);
        pointer-events: none;
      }

      .bottom-item {
        font-family: var(--mono);
        font-size: 0.5rem;
        color: rgba(0, 200, 255, 0.3);
        letter-spacing: 0.15em;
        text-align: center;
      }

      .bottom-item span {
        display: block;
        font-size: 0.65rem;
        color: rgba(0, 200, 255, 0.6);
        margin-top: 0.1rem;
      }

      /* GAMEPAD STATUS */
      .gp-status {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.15rem;
        margin-left: 1rem;
      }
      .gp-status .status-val.off {
        color: rgba(0, 200, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <header class="hud-header">
      <div class="hud-logo">
        <div class="hud-hex"></div>
        <div>
          <div class="hud-title">A.R.E.S</div>
          <div class="hud-subtitle">Autonomous Remote Engagement System</div>
        </div>
        <div class="gp-status">
          <div class="status-label">MANETTE</div>
          <div class="status-val off" id="gp-status-val">OFFLINE</div>
        </div>
      </div>
      <div class="hud-center">
        <div class="hud-mode">⬡ MODE COMBAT ACTIF ⬡</div>
        <div class="hud-status-bar">
          <div class="status-item">
            <div class="status-label">SYSTÈME</div>
            <div class="status-val ok">NOMINAL</div>
          </div>
          <div class="status-item">
            <div class="status-label">CAMÉRA</div>
            <div class="status-val warn" id="camera-status-val">OFFLINE</div>
          </div>
          <div class="status-item">
            <div class="status-label">TOURELLE</div>
            <div class="status-val warn" id="turret-status-val">OFFLINE</div>
          </div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 1rem">
        <div class="status-item">
          <div class="status-label">HEURE</div>
          <div class="hud-clock" id="clock">--:--:--</div>
        </div>
      </div>
    </header>

    <section class="main">
      <div id="content">
        <figure>
          <div id="stream-container" class="image-container">
            <img id="stream" alt="" />
            <canvas id="tracking-overlay"></canvas>
          </div>
        </figure>
      </div>
    </section>

    <div id="track-panel" role="group" aria-label="Suivi vidéo">
      <span id="track-status" aria-live="polite">Sélectionne une zone</span>
      <button id="track-select" type="button">SÉLECTION</button>
      <button id="track-start" type="button">SUIVRE</button>
      <button id="track-stop" type="button">ARRÊT</button>
    </div>

    <div class="crosshair">
      <div class="crosshair-ring"></div>
      <div class="crosshair-ring-inner"></div>
      <div class="line top"></div>
      <div class="line bottom"></div>
      <div class="line left"></div>
      <div class="line right"></div>
      <div class="tick t1"></div>
      <div class="tick t2"></div>
      <div class="tick t3"></div>
      <div class="tick t4"></div>
      <div class="center-dot"></div>
    </div>

    <div class="side-panel left">
      <div class="data-row">
        <div class="data-key">PAN</div>
        <div class="data-val" id="pan-val">000°</div>
      </div>
      <div class="data-row">
        <div class="data-key">TILT</div>
        <div class="data-val" id="tilt-val">000°</div>
      </div>
      <div class="data-row">
        <div class="data-key">ZOOM</div>
        <div class="data-val" id="zoom-val">x1.0</div>
      </div>
    </div>

    <div class="joystick chassis-joystick">
      <button id="chassis-up" class="up">▲</button>
      <button id="chassis-left" class="left">◀</button>
      <div class="center">●</div>
      <button id="chassis-right" class="right">▶</button>
      <button id="chassis-down" class="down">▼</button>
    </div>
    <div class="strafe-cmd">
      <button id="strafe-left">◀◀◀</button>
      <button id="strafe-right">▶▶▶</button>
    </div>

    <div class="joystick turret-joystick">
      <button id="tilt-up" class="up">▲</button>
      <button id="pan-left" class="left">◀</button>
      <div class="center">●</div>
      <button id="pan-right" class="right">▶</button>
      <button id="tilt-down" class="down">▼</button>
    </div>

    <button id="fire">FIRE</button>
    <button id="zoomBtn">X1</button>
    <button id="laserBtn">LASER OFF</button>
    <div class="hud-bottom">
      <div class="bottom-item">MODE<span>MANUEL</span></div>
      <div class="bottom-item">CIBLE<span id="target-coord">--- / ---</span></div>
      <div class="bottom-item">TIRS<span id="fire-count">0</span></div>
      <div class="bottom-item">ÉTAT<span style="color: var(--green)">PRÊT</span></div>
    </div>

    <script>
      /* ============================================================
      HORLOGE
      ============================================================ */
      function updateClock() {
        document.getElementById("clock").textContent = new Date().toLocaleTimeString("fr-FR", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }
      setInterval(updateClock, 1000);
      updateClock();

      document.addEventListener("DOMContentLoaded", function () {
        /* ============================================================
        ÉTAT GLOBAL + HELPERS
        Déclaré en premier : coverMetrics() lit zoomLevel dès le premier
        fitOverlay(), il doit donc exister avant.
        ============================================================ */
        const CHASSIS = "http://areschassis.local/control?cmd=";
        let fireCount = 0;
        let zoomLevel = 1;
        let laserOn = false;

        function fetchUrl(url) {
          fetch(url).catch((err) => console.error(err));
        }

        /* ============================================================
        LIAISON TOURELLE (WebSocket /ws)
        Une seule connexion : les commandes arrivent dans l'ordre d'envoi.
        Message texte "<var> <val>" (ex. "pan 1"). Un ping toutes les
        250 ms sert de battement de cœur : si l'ESP32 n'entend plus rien
        pendant 1,5 s, ou si la connexion se ferme, il arrête la tourelle.
        ============================================================ */
        const turret = (() => {
          const host = location.host || "ares.local"; // page ouverte en local → robot par mDNS
          const statusEl = document.getElementById("turret-status-val");
          const listeners = { close: [] };
          let ws = null;
          let retryMs = 500;
          let pingSentAt = 0;

          function setStatus(text, ok) {
            statusEl.textContent = text;
            statusEl.classList.toggle("ok", ok);
            statusEl.classList.toggle("warn", !ok);
          }

          function connect() {
            setStatus("CONNEXION…", false);
            ws = new WebSocket(`ws://${host}/ws`);
            ws.onopen = () => {
              retryMs = 500;
              setStatus("ONLINE", true);
            };
            ws.onmessage = (event) => {
              if (event.data === "pong" && pingSentAt) {
                setStatus(`${Math.round(performance.now() - pingSentAt)} ms`, true);
                pingSentAt = 0;
              }
            };
            ws.onclose = () => {
              setStatus("OFFLINE", false);
              listeners.close.forEach((fn) => fn());
              setTimeout(connect, retryMs);
              retryMs = Math.min(retryMs * 2, 5000);
            };
            ws.onerror = () => ws.close();
          }

          // Renvoie false si la liaison est coupée (commande perdue).
          function send(variable, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return false;
            ws.send(`${variable} ${value}`);
            return true;
          }

          // Un seul ping chronométré à la fois ; abandonné après 2 s si le pong se perd.
          setInterval(() => {
            const now = performance.now();
            if (send("ping", 0) && (!pingSentAt || now - pingSentAt > 2000)) pingSentAt = now;
          }, 250);

          connect();

          return {
            send,
            isOpen: () => !!ws && ws.readyState === WebSocket.OPEN,
            onClose: (fn) => listeners.close.push(fn),
          };
        })();

        const view = document.getElementById("stream");

        /* ============================================================
        VIDÉO (WebSocket ws://arescam.local:81/ws)
        Chaque "next" envoyé = une image JPEG reçue. On garde 2 demandes
        en vol : assez pour la fluidité, jamais d'images empilées dans le
        réseau, donc le retard ne peut pas s'accumuler.
        L'image est affichée dans <img id="stream"> via une URL blob : le
        zoom, la sélection et le suivi lisent cette balise comme avant, et
        une URL blob appartient à la page (pas de blocage CORS du canvas).
        ============================================================ */
        (() => {
          const CAM_URL = "ws://arescam.local:81/ws";
          const IN_FLIGHT = 2;
          const STALL_MS = 3000; // aucune image depuis 3 s → reconnexion
          const statusEl = document.getElementById("camera-status-val");
          let ws = null;
          let retryMs = 500;
          let shownUrl = null;
          let sentAt = []; // instants des demandes en vol, dans l'ordre
          let lastFrameAt = 0;
          let frames = 0;
          let latency = 0;

          function setStatus(text, ok) {
            statusEl.textContent = text;
            statusEl.classList.toggle("ok", ok);
            statusEl.classList.toggle("warn", !ok);
          }

          function requestFrame() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send("next");
            sentAt.push(performance.now());
          }

          function connect() {
            setStatus("CONNEXION…", false);
            ws = new WebSocket(CAM_URL);
            ws.binaryType = "blob";
            ws.onopen = () => {
              retryMs = 500;
              sentAt = [];
              lastFrameAt = performance.now();
              for (let i = 0; i < IN_FLIGHT; i++) requestFrame();
            };
            ws.onmessage = (event) => {
              if (!(event.data instanceof Blob)) return;
              const now = performance.now();
              const t0 = sentAt.shift();
              if (t0 !== undefined) latency = latency ? 0.8 * latency + 0.2 * (now - t0) : now - t0;
              lastFrameAt = now;
              frames++;
              requestFrame(); // une image reçue → une nouvelle demande
              const url = URL.createObjectURL(new Blob([event.data], { type: "image/jpeg" }));
              view.src = url;
              if (shownUrl) URL.revokeObjectURL(shownUrl);
              shownUrl = url;
            };
            ws.onclose = () => {
              setStatus("OFFLINE", false);
              setTimeout(connect, retryMs);
              retryMs = Math.min(retryMs * 2, 5000);
            };
            ws.onerror = () => ws.close();
          }

          // Compteur images/s + latence (demande → image reçue), et
          // reconnexion si le flux s'est figé (demande perdue).
          setInterval(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (performance.now() - lastFrameAt > STALL_MS) {
              ws.close();
              return;
            }
            setStatus(`${frames} IPS · ${Math.round(latency)} ms`, frames > 0);
            frames = 0;
          }, 1000);

          connect();
        })();

        const zoomBtn = document.getElementById("zoomBtn");
        const zoomVal = document.getElementById("zoom-val");

        function setZoom(level) {
          zoomLevel = level;
          document.body.classList.toggle("zoom-x2", level === 2);
          zoomBtn.textContent = "X" + level;
          zoomVal.textContent = "x" + level + ".0";
          drawTrackingOverlay();
        }

        /* ============================================================
        SUIVI VIDÉO
        Appariement d'un patch 15×15 en niveaux de gris (corrélation
        normalisée) sur une image réduite à 160×120.
        Le cadre affiché = exactement la zone réellement suivie.
        ============================================================ */
        const streamContainer = document.getElementById("stream-container");
        const overlay = document.getElementById("tracking-overlay");
        const overlayCtx = overlay.getContext("2d");
        const frameCanvas = document.createElement("canvas");
        frameCanvas.width = 160;
        frameCanvas.height = 120;
        const frameCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
        const trackStatus = document.getElementById("track-status");
        const targetCoord = document.getElementById("target-coord");

        const PATCH_SIZE = 15;
        const HALF = Math.floor(PATCH_SIZE / 2);
        const TRACK_DEAD_BAND = 0.08; // erreur normalisée sous laquelle la cible est "centrée"
        const TRACK_CONFIDENCE_MIN = 0.66;
        const TRACK_LOSS_FRAMES = 4; // images faibles consécutives, tourelle à l'arrêt
        const TRACK_SEARCH_RADIUS = 15;
        const TRACK_SEARCH_RADIUS_WIDE = 30; // quand la cible a été ratée (flou de bougé)
        const TRACK_INTERVAL_MS = 100;
        // Le flux MJPEG a plusieurs centaines de ms de retard : piloter en continu
        // fait systématiquement dépasser la cible puis osciller. On travaille donc
        // par impulsions : bouger un temps calculé, s'arrêter, attendre une image
        // prise APRÈS l'arrêt, mesurer, recommencer.
        const PULSE_MIN_MS = 40;
        const PULSE_MAX_MS = 400;
        const PULSE_FRACTION = 0.7; // on ne vise que 70 % de l'erreur : jamais de dépassement
        const SETTLE_MS = 450; // latence caméra + réseau après l'arrêt des moteurs
        const AXIS_SIGN_KEY = "ares.trackAxisSign";

        // sign : sens moteur → image, appris (inversé si la cible s'éloigne après
        // une impulsion). rate : erreur normalisée corrigée par ms d'impulsion.
        const axes = {
          pan: { sign: 1, rate: 1 / 600, wrongWay: 0 },
          tilt: { sign: 1, rate: 1 / 600, wrongWay: 0 },
        };
        try {
          const saved = JSON.parse(localStorage.getItem(AXIS_SIGN_KEY) || "{}");
          if (saved.pan === -1) axes.pan.sign = -1;
          if (saved.tilt === -1) axes.tilt.sign = -1;
        } catch (e) {}

        let target = null; // centre de la zone suivie, en coordonnées 160×120
        let patch = null;
        let tracking = false;
        let selecting = false;
        let weakFrames = 0;
        let lastTrackFrame = 0;
        let stale = false; // dernière recherche ratée → fenêtre de recherche élargie
        let moving = false; // impulsion en cours
        let settleUntil = 0; // pas de mesure avant cet instant (performance.now)
        let lastPulse = null; // { axe: { dir, ms, err } } de la dernière impulsion
        let generation = 0; // incrémenté à chaque arrêt : invalide les impulsions en vol

        function fitOverlay() {
          const rect = streamContainer.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          overlay.width = Math.max(1, Math.round(rect.width * dpr));
          overlay.height = Math.max(1, Math.round(rect.height * dpr));
          overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          drawTrackingOverlay();
        }

        // object-fit: cover + zoom CSS centré : l'échelle affichée est
        // l'échelle "cover" multipliée par le zoom, recadrée symétriquement.
        function coverMetrics() {
          const rect = streamContainer.getBoundingClientRect();
          const iw = view.naturalWidth || 640;
          const ih = view.naturalHeight || 480;
          const scale = Math.max(rect.width / iw, rect.height / ih) * zoomLevel;
          return {
            rect,
            iw,
            ih,
            scale,
            cropX: (iw * scale - rect.width) / 2,
            cropY: (ih * scale - rect.height) / 2,
          };
        }

        function pointerToFrame(event) {
          const m = coverMetrics();
          const x = ((event.clientX - m.rect.left + m.cropX) / m.scale / m.iw) * frameCanvas.width;
          const y = ((event.clientY - m.rect.top + m.cropY) / m.scale / m.ih) * frameCanvas.height;
          return { x, y };
        }

        function frameToOverlay(x, y) {
          const m = coverMetrics();
          return {
            x: (x / frameCanvas.width) * m.iw * m.scale - m.cropX,
            y: (y / frameCanvas.height) * m.ih * m.scale - m.cropY,
          };
        }

        // Un flux MJPEG ne "finit" jamais de charger : view.complete n'est pas
        // fiable. naturalWidth > 0 suffit à savoir qu'une image est décodée.
        function grayFrame() {
          if (!view.naturalWidth) {
            const err = new Error("Aucune image décodée");
            err.name = "NoFrame";
            throw err;
          }
          frameCtx.drawImage(view, 0, 0, frameCanvas.width, frameCanvas.height);
          const rgba = frameCtx.getImageData(0, 0, frameCanvas.width, frameCanvas.height).data;
          const gray = new Uint8Array(frameCanvas.width * frameCanvas.height);
          for (let i = 0, p = 0; i < rgba.length; i += 4, p++) gray[p] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
          return gray;
        }

        function frameErrorMessage(err) {
          if (err.name === "SecurityError") return "Flux bloqué (CORS)";
          if (err.name === "NoFrame") return "Flux caméra indisponible";
          return "Erreur d'image";
        }

        function makePatch(gray, cx, cy) {
          const values = new Float32Array(PATCH_SIZE * PATCH_SIZE);
          let mean = 0;
          for (let py = -HALF, i = 0; py <= HALF; py++) {
            for (let px = -HALF; px <= HALF; px++, i++) {
              values[i] = gray[(cy + py) * frameCanvas.width + cx + px];
              mean += values[i];
            }
          }
          mean /= values.length;
          let energy = 0;
          for (let i = 0; i < values.length; i++) {
            values[i] -= mean;
            energy += values[i] * values[i];
          }
          return energy < 80 ? null : { values, norm: Math.sqrt(energy) };
        }

        function scoreAt(gray, x, y) {
          const w = frameCanvas.width;
          let mean = 0;
          for (let py = -HALF; py <= HALF; py++) for (let px = -HALF; px <= HALF; px++) mean += gray[(y + py) * w + x + px];
          mean /= patch.values.length;
          let dot = 0,
            energy = 0;
          for (let py = -HALF, i = 0; py <= HALF; py++) {
            for (let px = -HALF; px <= HALF; px++, i++) {
              const delta = gray[(y + py) * w + x + px] - mean;
              dot += patch.values[i] * delta;
              energy += delta * delta;
            }
          }
          return energy > 80 ? dot / (patch.norm * Math.sqrt(energy)) : -1;
        }

        // Recherche grossière (pas de 2) puis affinage au pixel autour du meilleur.
        function matchPatch(gray, cx, cy, radius) {
          const xLo = HALF,
            xHi = frameCanvas.width - HALF - 1;
          const yLo = HALF,
            yHi = frameCanvas.height - HALF - 1;
          let best = { score: -1, x: cx, y: cy };
          for (let y = Math.max(yLo, cy - radius); y <= Math.min(yHi, cy + radius); y += 2) {
            for (let x = Math.max(xLo, cx - radius); x <= Math.min(xHi, cx + radius); x += 2) {
              const score = scoreAt(gray, x, y);
              if (score > best.score) best = { score, x, y };
            }
          }
          const coarse = best;
          for (let y = Math.max(yLo, coarse.y - 1); y <= Math.min(yHi, coarse.y + 1); y++) {
            for (let x = Math.max(xLo, coarse.x - 1); x <= Math.min(xHi, coarse.x + 1); x++) {
              const score = scoreAt(gray, x, y);
              if (score > best.score) best = { score, x, y };
            }
          }
          return best;
        }

        function drawTrackingOverlay() {
          const rect = streamContainer.getBoundingClientRect();
          overlayCtx.clearRect(0, 0, rect.width, rect.height);
          if (!target) {
            targetCoord.textContent = "--- / ---";
            return;
          }
          const color = tracking ? "#00ff88" : "#00c8ff";
          const tl = frameToOverlay(target.x - HALF, target.y - HALF);
          const br = frameToOverlay(target.x + HALF + 1, target.y + HALF + 1);
          overlayCtx.strokeStyle = color;
          overlayCtx.lineWidth = 2;
          overlayCtx.setLineDash(tracking ? [] : [7, 5]);
          overlayCtx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
          const c = frameToOverlay(target.x + 0.5, target.y + 0.5);
          overlayCtx.beginPath();
          overlayCtx.arc(c.x, c.y, 4, 0, Math.PI * 2);
          overlayCtx.fillStyle = color;
          overlayCtx.fill();
          targetCoord.textContent = String(Math.round(target.x)).padStart(3, "0") + " / " + String(Math.round(target.y)).padStart(3, "0");
        }

        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        // Les commandes passent par la même WebSocket : un 0 envoyé ici arrive
        // toujours AVANT une commande manuelle envoyée juste après.
        // force : envoie l'arrêt même si le suivi n'était pas actif (bouton ARRÊT).
        function stopTracking(reason, { force = false } = {}) {
          const wasTracking = tracking;
          tracking = false;
          generation++;
          setSelecting(false);
          if (wasTracking || force) {
            turret.send("pan", 0);
            turret.send("tilt", 0);
          }
          moving = false;
          lastPulse = null;
          if (reason) trackStatus.textContent = reason;
          drawTrackingOverlay();
        }

        // Toute commande manuelle de tourelle reprend la main sur le suivi.
        function takeOver(axis) {
          if (tracking) stopTracking("Commande manuelle");
        }

        function setSelecting(on) {
          selecting = on;
          streamContainer.classList.toggle("selecting", on);
        }

        function selectAt(point) {
          patch = null;
          target = null;
          try {
            const gray = grayFrame();
            const cx = Math.max(HALF, Math.min(frameCanvas.width - HALF - 1, Math.round(point.x)));
            const cy = Math.max(HALF, Math.min(frameCanvas.height - HALF - 1, Math.round(point.y)));
            patch = makePatch(gray, cx, cy);
            if (!patch) {
              trackStatus.textContent = "Zone trop uniforme, choisis une zone texturée";
              drawTrackingOverlay();
              return;
            }
            target = { x: cx, y: cy };
            trackStatus.textContent = "Zone sélectionnée · SUIVRE pour démarrer";
          } catch (error) {
            trackStatus.textContent = frameErrorMessage(error);
            console.error(error);
          }
          drawTrackingOverlay();
        }

        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        // Erreur par axe, normalisée [-1, 1] : positive → commande +1 attendue
        // (cible à droite pour pan, au-dessus pour tilt), au signe appris près.
        function trackError() {
          const w2 = frameCanvas.width / 2;
          const h2 = frameCanvas.height / 2;
          return { pan: (target.x - w2) / w2, tilt: -(target.y - h2) / h2 };
        }

        // Compare l'erreur avant / après la dernière impulsion :
        // - la cible s'est éloignée deux fois de suite → sens de l'axe inversé ;
        // - sinon on recale la vitesse (erreur corrigée par ms).
        function learnFromLastPulse(err) {
          if (!lastPulse) return;
          for (const [axis, p] of Object.entries(lastPulse)) {
            const a = axes[axis];
            const progress = (p.err - err[axis]) * Math.sign(p.err); // > 0 : rapproché du centre
            if (progress < -0.03) {
              if (++a.wrongWay >= 2) {
                a.sign = -a.sign;
                a.wrongWay = 0;
                try {
                  localStorage.setItem(AXIS_SIGN_KEY, JSON.stringify({ pan: axes.pan.sign, tilt: axes.tilt.sign }));
                } catch (e) {}
                console.log(`Suivi : sens ${axis} inversé automatiquement`);
              }
            } else if (progress > 0.02) {
              a.wrongWay = 0;
              a.rate = clamp(0.6 * a.rate + 0.4 * (progress / p.ms), 1 / 5000, 1 / 40);
            } else {
              a.rate = clamp(a.rate * 0.7, 1 / 5000, 1 / 40); // rien vu bouger : impulsion trop courte
            }
          }
          lastPulse = null;
        }

        // Pour chaque axe : départ → attente → arrêt, dans l'ordre sur la WebSocket.
        // Puis on attend SETTLE_MS pour que la caméra montre la position finale.
        // Si la liaison tombe en plein mouvement, l'ESP32 arrête seul la tourelle.
        async function runPulse(pulses) {
          const gen = generation;
          const entries = Object.entries(pulses);
          moving = true;
          for (const [axis, p] of entries) turret.send(axis, p.dir);
          await Promise.all(
            entries.map(async ([axis, p]) => {
              await delay(p.ms);
              if (gen === generation) turret.send(axis, 0); // sinon stopTracking a déjà arrêté
            }),
          );
          if (gen !== generation) return;
          settleUntil = performance.now() + SETTLE_MS;
          moving = false;
        }

        function correctAim() {
          const err = trackError();
          learnFromLastPulse(err);
          const pulses = {};
          for (const axis of ["pan", "tilt"]) {
            const e = err[axis];
            if (Math.abs(e) <= TRACK_DEAD_BAND) continue;
            pulses[axis] = {
              dir: (e > 0 ? 1 : -1) * axes[axis].sign,
              ms: Math.round(clamp((Math.abs(e) * PULSE_FRACTION) / axes[axis].rate, PULSE_MIN_MS, PULSE_MAX_MS)),
              err: e,
            };
          }
          if (Object.keys(pulses).length === 0) return false;
          if (!turret.isOpen()) {
            stopTracking("Liaison tourelle coupée — arrêt");
            return false;
          }
          lastPulse = pulses;
          runPulse(pulses);
          return true;
        }

        function trackFrame(timestamp) {
          if (!tracking) return;
          if (timestamp - lastTrackFrame < TRACK_INTERVAL_MS) {
            requestAnimationFrame(trackFrame);
            return;
          }
          lastTrackFrame = timestamp;
          const settled = !moving && performance.now() >= settleUntil;
          try {
            const gray = grayFrame();
            const radius = stale ? TRACK_SEARCH_RADIUS_WIDE : TRACK_SEARCH_RADIUS;
            const match = matchPatch(gray, Math.round(target.x), Math.round(target.y), radius);
            if (match.score < TRACK_CONFIDENCE_MIN) {
              stale = true;
              // Pendant un mouvement le flou de bougé est normal : on ne compte
              // les échecs que tourelle arrêtée et image stabilisée.
              if (settled && ++weakFrames >= TRACK_LOSS_FRAMES) {
                stopTracking("Cible perdue — moteurs arrêtés");
                return;
              }
              trackStatus.textContent = settled ? "Confiance faible…" : "Déplacement…";
            } else {
              weakFrames = 0;
              stale = false;
              target.x = match.x;
              target.y = match.y;
              const score = `${(match.score * 100).toFixed(0)}%`;
              if (!settled) trackStatus.textContent = `Déplacement · ${score}`;
              else if (correctAim()) trackStatus.textContent = `Correction · ${score}`;
              else trackStatus.textContent = `Verrouillé · ${score}`;
            }
            drawTrackingOverlay();
          } catch (error) {
            console.error(error);
            stopTracking(frameErrorMessage(error) + " — moteurs arrêtés");
            return;
          }
          requestAnimationFrame(trackFrame);
        }

        streamContainer.addEventListener("pointerdown", (event) => {
          if (!selecting || tracking) return;
          event.preventDefault();
          setSelecting(false);
          selectAt(pointerToFrame(event));
        });

        document.getElementById("track-select").addEventListener("click", () => {
          stopTracking("Clique sur l'objet dans l'image");
          setSelecting(true);
        });

        document.getElementById("track-start").addEventListener("click", () => {
          if (!patch || !target) {
            trackStatus.textContent = "Sélectionne d'abord l'objet";
            return;
          }
          if (tracking) return;
          tracking = true;
          weakFrames = 0;
          lastTrackFrame = 0;
          stale = false;
          moving = false;
          settleUntil = 0;
          lastPulse = null;
          axes.pan.wrongWay = axes.tilt.wrongWay = 0;
          trackStatus.textContent = "Suivi actif";
          drawTrackingOverlay();
          requestAnimationFrame(trackFrame);
        });

        document.getElementById("track-stop").addEventListener("click", () => stopTracking("Suivi arrêté", { force: true }));

        window.addEventListener("resize", fitOverlay);
        view.addEventListener("load", fitOverlay, { once: true });
        window.addEventListener("blur", () => {
          if (tracking) stopTracking("Fenêtre inactive — arrêt");
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && tracking) stopTracking("Page masquée — arrêt");
        });
        // Fermeture de la page : la WebSocket se ferme et l'ESP32 arrête la
        // tourelle de lui-même ; on envoie quand même l'arrêt par principe.
        window.addEventListener("pagehide", () => {
          turret.send("pan", 0);
          turret.send("tilt", 0);
        });
        turret.onClose(() => {
          if (tracking) stopTracking("Liaison tourelle coupée — arrêt");
        });

        fitOverlay();

        /* ============================================================
        BOUTONS À L'ÉCRAN
        ============================================================ */
        // start / stop : fonctions qui envoient la commande correspondante.
        function bindControl(button, start, stop, onStart) {
          let active = false;
          button.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            active = true;
            if (onStart) onStart();
            start();
          });
          const stopHandler = (e) => {
            e.preventDefault();
            if (!active) return; // pas de "stop" parasite au simple survol
            active = false;
            stop();
          };
          button.addEventListener("pointerup", stopHandler);
          button.addEventListener("pointerleave", stopHandler);
          button.addEventListener("pointercancel", stopHandler);
        }

        // Tourelle
        const panLeft = document.getElementById("pan-left");
        const panRight = document.getElementById("pan-right");
        const tiltUp = document.getElementById("tilt-up");
        const tiltDown = document.getElementById("tilt-down");
        const turretCmd = (axis, value) => () => turret.send(axis, value);
        bindControl(panLeft, turretCmd("pan", -1), turretCmd("pan", 0), () => takeOver("pan"));
        bindControl(panRight, turretCmd("pan", 1), turretCmd("pan", 0), () => takeOver("pan"));
        bindControl(tiltUp, turretCmd("tilt", 1), turretCmd("tilt", 0), () => takeOver("tilt"));
        bindControl(tiltDown, turretCmd("tilt", -1), turretCmd("tilt", 0), () => takeOver("tilt"));

        // Châssis
        const chassisUp = document.getElementById("chassis-up");
        const chassisLeft = document.getElementById("chassis-left");
        const chassisRight = document.getElementById("chassis-right");
        const chassisDown = document.getElementById("chassis-down");
        const strafeLeftBtn = document.getElementById("strafe-left");
        const strafeRightBtn = document.getElementById("strafe-right");
        const chassisCmd = (cmd) => () => fetchUrl(CHASSIS + cmd);
        bindControl(chassisUp, chassisCmd("forward"), chassisCmd("stop"));
        bindControl(chassisLeft, chassisCmd("rotate_left"), chassisCmd("stop"));
        bindControl(chassisRight, chassisCmd("rotate_right"), chassisCmd("stop"));
        bindControl(chassisDown, chassisCmd("backward"), chassisCmd("stop"));
        bindControl(strafeLeftBtn, chassisCmd("strafe_left"), chassisCmd("stop"));
        bindControl(strafeRightBtn, chassisCmd("strafe_right"), chassisCmd("stop"));

        /* ============================================================
        ARMEMENT / SYSTÈMES
        ============================================================ */
        const fire = document.getElementById("fire");
        fire.onclick = () => {
          turret.send("Fire", 1);
          fireCount++;
          document.getElementById("fire-count").textContent = fireCount;
          document.body.style.boxShadow = "inset 0 0 100px rgba(255,48,52,0.3)";
          setTimeout(() => (document.body.style.boxShadow = ""), 200);
        };

        zoomBtn.onclick = () => setZoom(zoomLevel === 1 ? 2 : 1);

        const laserBtn = document.getElementById("laserBtn");
        laserBtn.onclick = () => {
          laserOn = !laserOn;
          laserBtn.textContent = laserOn ? "LASER ON" : "LASER OFF";
          turret.send("laser", laserOn ? 1 : 0);
        };

        /* ============================================================
        CLAVIER
        ============================================================ */
        const KEY_MAP = {
          ArrowLeft: ["pan", -1],
          ArrowRight: ["pan", 1],
          ArrowUp: ["tilt", 1],
          ArrowDown: ["tilt", -1],
        };

        document.addEventListener("keydown", (e) => {
          if (e.key === " " || e.key === "Spacebar") {
            e.preventDefault();
            if (!e.repeat) fire.click();
            return;
          }
          const cmd = KEY_MAP[e.key];
          if (!cmd) return;
          e.preventDefault();
          if (e.repeat) return;
          takeOver(cmd[0]);
          turret.send(cmd[0], cmd[1]);
        });

        document.addEventListener("keyup", (e) => {
          const cmd = KEY_MAP[e.key];
          if (!cmd) return;
          turret.send(cmd[0], 0);
        });

        /* ============================================================
        MANETTE (Xbox / mapping "standard")
        ------------------------------------------------------------
          - Stick gauche (axes 0/1) -> châssis, axe dominant uniquement
          - LB (4) / RB (5)         -> strafe gauche / droite (prioritaire)
          - D-pad (12-15)           -> tourelle (prioritaire sur le stick)
          - Stick droit (axes 2/3)  -> tourelle
          - A (0) ou RT (7)         -> FIRE (front montant)
          - LT (6)                  -> zoom maintenu
        Le châssis reçoit UNE commande calculée à partir de tous les
        contrôles : relâcher un axe n'envoie plus de "stop" si l'autre
        est encore tenu.
        ============================================================ */
        const DEADZONE = 0.25;

        const prevState = {
          chassisCmd: "stop",
          turretPan: 0,
          turretTilt: 0,
          fire: false,
          zoom: false,
        };

        const gpStatusEl = document.getElementById("gp-status-val");

        function setBtnActive(el, active) {
          if (el) el.classList.toggle("gp-active", active);
        }

        function getGamepad() {
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (const pad of pads) if (pad && pad.connected) return pad;
          return null;
        }

        function pressed(pad, i) {
          return !!(pad.buttons[i] && pad.buttons[i].pressed);
        }

        function stickDir(v) {
          return Math.abs(v) > DEADZONE ? (v > 0 ? 1 : -1) : 0;
        }

        function chassisCommand(pad) {
          const lb = pressed(pad, 4);
          const rb = pressed(pad, 5);
          if (lb && !rb) return "strafe_left";
          if (rb && !lb) return "strafe_right";
          const x = pad.axes[0] || 0;
          const y = pad.axes[1] || 0;
          if (Math.max(Math.abs(x), Math.abs(y)) <= DEADZONE) return "stop";
          if (Math.abs(x) > Math.abs(y)) return x > 0 ? "rotate_right" : "rotate_left";
          return y < 0 ? "forward" : "backward";
        }

        function pollGamepad() {
          const pad = getGamepad();

          if (!pad) {
            gpStatusEl.textContent = "OFFLINE";
            gpStatusEl.classList.remove("ok");
            gpStatusEl.classList.add("off");
            requestAnimationFrame(pollGamepad);
            return;
          }

          gpStatusEl.textContent = "ONLINE";
          gpStatusEl.classList.remove("off");
          gpStatusEl.classList.add("ok");

          // ---- CHÂSSIS
          const cmd = chassisCommand(pad);
          if (cmd !== prevState.chassisCmd) {
            fetchUrl(CHASSIS + cmd);
            prevState.chassisCmd = cmd;
            setBtnActive(chassisUp, cmd === "forward");
            setBtnActive(chassisDown, cmd === "backward");
            setBtnActive(chassisLeft, cmd === "rotate_left");
            setBtnActive(chassisRight, cmd === "rotate_right");
            setBtnActive(strafeLeftBtn, cmd === "strafe_left");
            setBtnActive(strafeRightBtn, cmd === "strafe_right");
          }

          // ---- TOURELLE : D-pad prioritaire, sinon stick droit
          let turretPan = pressed(pad, 14) ? -1 : pressed(pad, 15) ? 1 : stickDir(pad.axes[2] || 0);
          let turretTilt = pressed(pad, 12) ? 1 : pressed(pad, 13) ? -1 : -stickDir(pad.axes[3] || 0);
          turretTilt = turretTilt || 0; // évite -0

          if (turretPan !== prevState.turretPan) {
            takeOver("pan");
            turret.send("pan", turretPan);
            prevState.turretPan = turretPan;
            setBtnActive(panLeft, turretPan === -1);
            setBtnActive(panRight, turretPan === 1);
          }

          if (turretTilt !== prevState.turretTilt) {
            takeOver("tilt");
            turret.send("tilt", turretTilt);
            prevState.turretTilt = turretTilt;
            setBtnActive(tiltUp, turretTilt === 1);
            setBtnActive(tiltDown, turretTilt === -1);
          }

          // ---- FIRE (front montant)
          const fireBtn = pressed(pad, 0) || pressed(pad, 7);
          if (fireBtn && !prevState.fire) fire.click();
          prevState.fire = fireBtn;
          setBtnActive(fire, fireBtn);

          // ---- ZOOM maintenu
          const ltPressed = pressed(pad, 6);
          if (ltPressed !== prevState.zoom) setZoom(ltPressed ? 2 : 1);
          prevState.zoom = ltPressed;

          requestAnimationFrame(pollGamepad);
        }

        window.addEventListener("gamepadconnected", (e) => {
          console.log("Manette connectée :", e.gamepad.id, "mapping:", e.gamepad.mapping);
        });

        window.addEventListener("gamepaddisconnected", (e) => {
          console.log("Manette déconnectée :", e.gamepad.id);
          if (prevState.turretPan !== 0) turret.send("pan", 0);
          if (prevState.turretTilt !== 0) turret.send("tilt", 0);
          if (prevState.chassisCmd !== "stop") fetchUrl(CHASSIS + "stop");
          if (prevState.zoom) setZoom(1);
          prevState.turretPan = 0;
          prevState.turretTilt = 0;
          prevState.chassisCmd = "stop";
          prevState.fire = false;
          prevState.zoom = false;
          [chassisUp, chassisDown, chassisLeft, chassisRight, strafeLeftBtn, strafeRightBtn, panLeft, panRight, tiltUp, tiltDown, fire].forEach((el) =>
            setBtnActive(el, false),
          );
        });

        // Polling permanent : Safari ne déclenche gamepadconnected
        // qu'après une première interaction.
        requestAnimationFrame(pollGamepad);
      });
    </script>
  </body>
</html>
